<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Expense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4">Update Expense</h2>

        <form th:action="@{/save}" th:object="${expense}" method="post">

            <!-- Hidden ID -->
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label>Amount</label>
                <input type="number" th:field="*{amount}" class="form-control">
            </div>

            <div class="mb-3">
                <label>Category</label>
                <input type="text" th:field="*{category}" class="form-control">
            </div>

            <div class="mb-3">
                <label>Description</label>
                <input type="text" th:field="*{description}" class="form-control">
            </div>

            <div class="mb-3">
                <label>Date</label>
                <input type="date" th:field="*{expenseDate}" class="form-control">
            </div>

            <button type="submit" class="btn btn-success w-100">
                Update Expense
            </button>

        </form>
    </div>
</div>

</body>
</html>
