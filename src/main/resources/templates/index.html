<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
    }

    .container {
        margin-top: 60px;
    }

    .card {
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
    }

    h2 {
        font-weight: 600;
        color: #333;
        letter-spacing: 1px;
    }

    table {
        border-radius: 10px;
        overflow: hidden;
    }

    thead {
        background: linear-gradient(45deg, #2c3e50, #4ca1af);
        color: white;
    }

    tbody tr {
        transition: all 0.3s ease;
    }

    tbody tr:hover {
        background-color: #f3f8ff;
        transform: scale(1.01);
    }

    .btn-primary {
        background: linear-gradient(45deg, #ff7e5f, #feb47b);
        border: none;
        border-radius: 10px;
    }

    .btn-warning {
        background: #ffd166;
        border: none;
        border-radius: 8px;
    }

    .btn-danger {
        background: #ef476f;
        border: none;
        border-radius: 8px;
    }

    .btn:hover {
        opacity: 0.9;
    }

    h5 {
        font-weight: 500;
        color: #444;
    }
</style>
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-lg p-4">

        <!-- Heading -->
        <h2 class="text-center mb-4">Expense Tracker</h2>

        <!-- Table -->
        <table class="table table-bordered table-hover text-center">

            <thead class="table-dark">
                <tr>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="expense : ${expenses}">
                    <td th:text="${expense.amount}"></td>
                    <td th:text="${expense.category}"></td>
                    <td th:text="${expense.description}"></td>
                    <td th:text="${expense.expenseDate}"></td>
                    <td>
                        <a th:href="@{/edit/{id}(id=${expense.id})}" 
                           class="btn btn-warning btn-sm me-2">
                            Edit
                        </a>

                        <a th:href="@{/delete/{id}(id=${expense.id})}" 
                           class="btn btn-danger btn-sm">
                            Delete
                        </a>
                    </td>
                </tr>
            </tbody>

        </table>

        <!-- buttons are here -->
        <div class="d-flex justify-content-between align-items-center mt-3">
            <a th:href="@{/add}" class="btn btn-primary">
                + Add Expense
            </a>

            <h5>Total: ₹ <span th:text="${total}"></span></h5>
        </div>

    </div>

</div>

</body>
</html>
